<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ikrom Mirzayev · Fullstack dasturchi</title>
    <meta name="description" content="Ikrom Mirzayev, fullstack dasturchi: React, Next.js, Node.js va PostgreSQL'da qurilgan loyihalar va rezyume." />
    <meta property="og:title" content="Ikrom Mirzayev · Fullstack dasturchi" />
    <meta property="og:description" content="React va Next.js'da qurilgan loyihalar: Respublika kutubxonalari platformasi, SmartLibrary, Tashkent Book Fest IV, Taewoong Travel." />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("pf-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var h = localStorage.getItem("pf-hue");
        if (h) document.documentElement.style.setProperty("--accent-h", h);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
